name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches: 
      - main
      - 'feature/*'

jobs:
  unit_testing:
    name: Unit Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup NodeJS Version - 18
        uses: actions/setup-node@v7
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm Install

      - name: Unit Testing
        run: npm test